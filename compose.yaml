services:
  backend:
    build: ./backend
    container_name: secureaudit-backend
    ports:
      - "5051:5051"
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: secureaudit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads: